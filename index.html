<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alke Wallet | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>
<body class="bg-light">
<img src="assets/img/Logo.png"
     alt="Logo Alke Wallet"
     class="top-left-img">

    <div class="container-fluid vh-100">
    <div class="row h-100">

        <!-- Columna izquerda -->
        <div class="col-md-7 d-none d-md-flex flex-column align-items-center justify-content-center left-panel">

    <div class="image-text">
        <h1>Tu biletera élite</h1>
        <p>Gestiona tus finanzas de forma simple, segura y con estilo</p>
    </div>

    <img src="assets/img/Login.png"
         alt="Ilustración billetera digital"
         class="img-fluid wallet-img">

</div>

        <!-- Columna derecha -->
        <div class="col-md-5 d-flex flex-column align-items-center justify-content-center gap-3">

    <!-- Logo -->
    <div class="card title-card text-center shadow">
        <h2>Alke Wallet</h2>
    </div>

    <!-- Inicio de sesión -->
    <div class="card shadow p-4 login-card">

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="email" class="form-control" required> <!--Verificar email-->
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required> <!--Verificar contraseña-->
            </div>

            <div id="errorMsg" class="text-danger text-center mb-3"></div> <!--Mensaje de error-->
            
            <!--Habilitar boton-->
            <button type="submit"
                id="loginBtn"
                class="btn btn-primary w-100"
                 disabled>
                Iniciar sesión
            </button>

            <!--Registro-->
            <div class="text-center mt-3">
    <span class="text-secondary">¿No tienes cuenta?</span><br>
    <a href="login.html" class="create-account-link">
    Crear cuenta
    </a>
</div>
        </form>

    </div>
</div>
    <!--Librerias-->
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
