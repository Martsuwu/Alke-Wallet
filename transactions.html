<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transacciones | Alke Wallet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/global.css">
    <style>
        .transaction-item {
            background: #2a2a2a;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .transaction-deposit {
            border-left-color: #28a745;
        }
        .transaction-withdraw {
            border-left-color: #dc3545;
        }
        .transaction-transfer {
            border-left-color: #ffc107;
        }
        .transaction-amount {
            font-size: 18px;
            font-weight: bold;
        }
        .amount-positive {
            color: #28a745;
        }
        .amount-negative {
            color: #dc3545;
        }
    </style>
</head>

<body class="bg-black text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Alke Wallet</a>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card bg-dark text-white">
                <div class="card-body">
                    <h4 class="card-title mb-4">Historial de Transacciones</h4>

                    <div id="transactionsList"></div>

                    <div id="emptyMessage" class="text-center text-muted">
                        <p>No hay transacciones aún</p>
                    </div>
                </div>
            </div>

            <button class="btn btn-outline-light w-100 mt-3" onclick="window.location.href='menu.html'">
                Volver al menú
            </button>
        </div>
    </div>
</div>

<script src="Js/utils.js"></script>
<script src="Js/transactions.js"></script>
</body>
</html>
