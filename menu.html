<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alke Wallet | Billetera</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="wallet-bg">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="#">Alke Wallet</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">

            <li class="nav-item">
                <a class="nav-link" href="#">Inicio</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">Realizar depósito</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">Retiro de fondos</a>
            </li>

            <li class="nav-item ms-lg-3">
                <button id="logoutBtn" class="btn btn-dark-outline">
                    Cerrar sesión
                </button>
            </li>

        </ul>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4 justify-content-center">

        <!-- PANEL IZQUIERDO -->
        <div class="col-md-6 d-flex justify-content-center">
            <div class="wallet-panel wallet-panel-dark">

                <div class="wallet-box text-center">
                    <p class="fw-semibold mb-2">Datos personales</p>
                    <p class="mb-1"><strong>Nombre:</strong></p>
                    <p id="userName" class="text-muted"></p>

                    <p class="mb-1 mt-2"><strong>Correo:</strong></p>
                    <p id="userEmail" class="text-muted"></p>
                </div>

                <div class="wallet-box text-center">
                    <p class="mb-1 text-muted">Saldo</p>
                    <h2>$ <span id="balance">0</span></h2>
                </div>

                <button class="wallet-box wallet-clickable text-center" id="historyBtn">
                    <p class="fw-semibold mb-0">Historial de movimientos</p>
                </button>

            </div>
        </div>

        <!-- PANEL DERECHO -->
        <div class="col-md-6 d-flex justify-content-center">
            <div class="wallet-panel">

                <div class="wallet-box text-center">
                    <p class="fw-semibold mb-0">Contactos</p>
                </div>
                
                 <div id="contactsList"></div>

                <button class="wallet-box wallet-clickable text-center" id="addContactBtn">
                    <p class="fw-semibold mb-0">+ Agregar contacto</p>
                </button>

            </div>
        </div>

    </div>
</div>

<script src="js/menu.js"></script>
</body>
</html>
