<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencia | Alke Wallet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="CSS/global.css">
</head>

<body class="bg-black text-white">

<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card bg-dark text-white p-4 shadow"
         style="max-width: 420px; width: 100%; border-radius: 20px;">

        <h4 class="text-center mb-4">Transferencia</h4>

        <!-- Nombre del destinatario con autocompletar -->
        <div class="mb-3">
            <label class="form-label">Nombre del destinatario</label>
            <input type="text" id="recipientName" class="form-control" 
                   placeholder="Ej: Juan Pérez" autocomplete="off" data-validar="nombre">
            <div id="contactSuggestions" class="list-group position-absolute w-100" 
                 style="display: none; max-height: 200px; overflow-y: auto; z-index: 1000;">
            </div>
        </div>

        <!-- Correo del destinatario -->
        <div class="mb-3">
            <label class="form-label">Correo del destinatario</label>
            <input type="email" id="recipientEmail" class="form-control" 
                   placeholder="Ej: juan@example.com" data-validar="email">
        </div>

        <!-- Monto -->
        <div class="mb-3">
            <label class="form-label">Monto</label>
            <input type="number" id="amount" class="form-control" placeholder="Ej: 10000">
        </div>

        <!-- Saldo disponible -->
        <div class="mb-3 p-2 bg-secondary rounded">
            <small>Saldo disponible: $<span id="balanceAvailable">0</span></small>
        </div>

        <button id="transferBtn" type="button" class="btn btn-light w-100">
            Realizar transferencia
        </button>

        <div id="msg" class="text-center mt-3"></div>
        <hr class="my-3">

        <button class="btn btn-outline-light w-100" onclick="window.location.href='menu.html'">
            Volver al menú
        </button>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="Js/utils.js"></script>
<script src="Js/jquery-utils.js"></script>
<script src="Js/animations.js"></script>
<script src="Js/sendmoney.js"></script>
</body>
</html>
