<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Alke Wallet | Crear cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 login-card">

        <h3 class="text-center mb-4">Crear cuenta</h3>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" id="name" class="form-control" required> <!--Verificar nombre-->
            </div>

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="email" class="form-control" required> <!--Verificar email-->
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" required> <!--Verificar contraseña-->
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" class="form-control" required>  <!--Verificar contraseña-->
            </div>

            <div id="errorMsg" class="text-danger text-center mb-3"></div> <!--Mensaje de error-->

            <button type="submit" class="btn btn-primary w-100">
                Crear cuenta
            </button>
        </form>

        <!-- Redirigir al login -->
        <div class="text-center mt-3">
            <a href="index.html">Volver al login</a>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/register.js"></script>

</body>
</html>
