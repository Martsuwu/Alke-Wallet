<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Depósito | Alke Wallet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-body">

                    <h4 class="text-center mb-4">Realizar Depósito</h4>

                    <div class="mb-3">
                        <label class="form-label">Monto a depositar</label>
                        <input type="number" id="depositAmount" class="form-control" placeholder="Ej: 10000">
                    </div>

                    <button id="depositBtn" class="btn btn-dark w-100">
                        Depositar
                    </button>

                    <div id="depositMsg" class="mt-3 text-center"></div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="js/deposit.js"></script>
</body>
</html>
